<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">衔尾者 OUROBOROS — 贪食蛇 × Roguelike 地牢：12 层程序化地牢，蛇身咬住自己的尾巴</title>
  <desc id="desc">深蓝黑地牢底：左上标题衔尾者；右侧一条翠绿蛇身盘成圆环、蛇头咬住尾巴，圆环中央是金色传送门菱形与 12 层字样。</desc>

  <rect width="1200" height="360" rx="26" fill="#05060a"/>

  <g id="tiles" fill="#1a2130">
    <rect x="780" y="36" width="32" height="32" rx="4"/>
    <rect x="816" y="36" width="32" height="32" rx="4" fill="#1e2739"/>
    <rect x="1080" y="36" width="32" height="32" rx="4"/>
    <rect x="1116" y="36" width="32" height="32" rx="4" fill="#1e2739"/>
    <rect x="780" y="292" width="32" height="32" rx="4" fill="#1e2739"/>
    <rect x="816" y="292" width="32" height="32" rx="4"/>
    <rect x="1080" y="292" width="32" height="32" rx="4" fill="#1e2739"/>
    <rect x="1116" y="292" width="32" height="32" rx="4"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#7cffb2">贪食蛇 × ROGUELIKE · SNAKE ROGUELIKE</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#e8f0ff">衔尾者</text>
    <text x="56" y="168" font-size="23" fill="#b9c6de">OUROBOROS — 身体是资源，不是枷锁</text>
    <text x="56" y="204" font-size="19" fill="#8296b4">12 层程序化地牢，美术与音乐全部运行时生成。</text>
    <g id="chips" font-size="18" fill="#e8f0ff" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#141a28" stroke="#2b3550" stroke-width="1.5"/><text x="119" y="262">12 层地牢</text></g>
      <g><rect x="194" y="238" width="204" height="36" rx="18" fill="#141a28" stroke="#2b3550" stroke-width="1.5"/><text x="296" y="262">24 升级 · 23 遗物</text></g>
      <g><rect x="410" y="238" width="126" height="36" rx="18" fill="#141a28" stroke="#2b3550" stroke-width="1.5"/><text x="473" y="262">7 种敌人</text></g>
      <g><rect x="548" y="238" width="186" height="36" rx="18" fill="#141a28" stroke="#2b3550" stroke-width="1.5"/><text x="641" y="262">零素材全程序化</text></g>
    </g>
  </g>

  <g id="ouroboros">
    <g id="ring" fill="none" stroke="#2fae62" stroke-width="26">
      <circle cx="964" cy="180" r="96"/>
    </g>
    <g id="ring-highlight" fill="none" stroke="#7cffb2" stroke-width="10" stroke-linecap="round" opacity="0.85">
      <path d="M 964 84 A 96 96 0 0 1 1060 180"/>
    </g>
    <g id="tail" transform="translate(912 100) rotate(-17)">
      <path d="M 0 -13 L 30 0 L 0 13 Z" fill="#2fae62"/>
    </g>
    <g id="head" transform="translate(964 84)">
      <circle r="24" fill="#3ecf6e"/>
      <circle cx="-8" cy="-8" r="4.5" fill="#05060a"/>
      <circle cx="8" cy="-8" r="4.5" fill="#05060a"/>
      <path d="M -6 12 L 0 22 L 6 12 Z" fill="#ff4d6d"/>
    </g>
    <g id="portal" transform="translate(964 180)">
      <polygon points="0,-26 18,0 0,26 -18,0" fill="#ffd166"/>
      <polygon points="0,-14 10,0 0,14 -10,0" fill="#fff3c4"/>
    </g>
    <g id="center-label" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="964" y="238" font-size="19" fill="#e8f0ff" text-anchor="middle">12 层 · 直达深渊</text>
    </g>
  </g>
</svg>
