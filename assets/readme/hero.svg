<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">衔尾者 · OUROBOROS Hero Banner</title>
  <desc id="hero-desc">Tactical roguelike snake crawler featuring 12 procedural depths, dash crushing, body-as-resource digestion, 480-ray FOV, and zero-asset runtime procedural generation.</desc>

  <defs>
    <!-- Background Gradient -->
    <radialGradient id="voidGradient" cx="65%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="50%" stop-color="#0a0f19"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>

    <!-- Ouroboros Glow Ring -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7cffb2" stop-opacity="0.3"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>

    <!-- Dash Wave Pulse -->
    <radialGradient id="dashShock" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#7cffb2" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for Snake Body -->
    <linearGradient id="ouroHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6fff3"/>
      <stop offset="40%" stop-color="#7cffb2"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="ouroBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cffb2"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="wardenBossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="50%" stop-color="#ff2e63"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>

    <linearGradient id="spitterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#b98bff"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <linearGradient id="cardGradOuro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b101c" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Dungeon Grid Pattern (32px scale) -->
    <pattern id="ouroGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#151b27"/>
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#232d3f" stroke-width="1"/>
      <rect x="1" y="1" width="30" height="30" fill="#1a2130" fill-opacity="0.8"/>
      <circle cx="16" cy="16" r="1.2" fill="#2d3a52"/>
    </pattern>

    <!-- Filters -->
    <filter id="ouroGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="brightBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="9" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="440" rx="16" fill="url(#voidGradient)"/>
  <rect width="1200" height="440" rx="16" fill="none" stroke="#253248" stroke-width="2"/>

  <!-- Right Stage: Tactical 2-Tile Corridor Diorama -->
  <g id="tactical-stage" transform="translate(480, 24)">
    <!-- Room Floor Surface -->
    <rect x="0" y="0" width="690" height="392" rx="12" fill="url(#ouroGrid)"/>
    <rect x="0" y="0" width="690" height="392" rx="12" fill="none" stroke="#2b3b55" stroke-width="1.5"/>

    <!-- 2-Tile Wide Corridors & Stone Pillars -->
    <!-- Top Wall Bank -->
    <rect x="0" y="0" width="690" height="36" rx="4" fill="#2b3550" stroke="#3d4b70" stroke-width="1.5"/>
    <rect x="4" y="4" width="682" height="12" fill="#3d4b70" opacity="0.6"/>
    <!-- Bottom Wall Bank -->
    <rect x="0" y="356" width="690" height="36" rx="4" fill="#2b3550" stroke="#3d4b70" stroke-width="1.5"/>

    <!-- Corridor Pillars (Enforcing 2-tile wide routes) -->
    <rect x="96" y="80" width="64" height="80" rx="4" fill="#242c42" stroke="#3d4b70" stroke-width="1.5"/>
    <rect x="100" y="84" width="56" height="72" rx="2" fill="#1b2132"/>
    <rect x="360" y="80" width="64" height="80" rx="4" fill="#242c42" stroke="#3d4b70" stroke-width="1.5"/>
    <rect x="364" y="84" width="56" height="72" rx="2" fill="#1b2132"/>

    <!-- Rubble & Deep Pit Obstacles -->
    <!-- Pit (hazard) -->
    <rect x="220" y="270" width="64" height="48" rx="4" fill="#05060a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="252" y="298" font-family="ui-monospace, monospace" font-size="10" fill="#475569" text-anchor="middle">PIT</text>
    <!-- Rubble -->
    <circle cx="130" cy="280" r="12" fill="#334155" stroke="#475569" stroke-width="1"/>
    <circle cx="146" cy="285" r="9" fill="#475569"/>

    <!-- Ouroboros Circular Emblem Aura in Center Floor -->
    <g transform="translate(290, 200)">
      <circle cx="0" cy="0" r="160" fill="url(#ringGlow)"/>
      <circle cx="0" cy="0" r="120" fill="none" stroke="#7cffb2" stroke-width="1" stroke-dasharray="6 8" opacity="0.3"/>
      <!-- Ancient Circular Serpent Rune Icon -->
      <path d="M 0 -80 A 80 80 0 1 1 -56 56 A 80 80 0 0 1 0 -80" fill="none" stroke="#7cffb2" stroke-width="2.5" opacity="0.2"/>
    </g>

    <!-- Raycasting FOV 480 Rays Representation (Arc Sweep) -->
    <path d="M 270 200 L 460 110 A 240 240 0 0 1 480 300 Z" fill="#7cffb2" fill-opacity="0.06"/>
    <line x1="270" y1="200" x2="460" y2="110" stroke="#7cffb2" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
    <line x1="270" y1="200" x2="480" y2="300" stroke="#7cffb2" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>

    <!-- THE OUROBOROS SERPENT -->
    <!-- Self-Digest Coiling Maneuver: Serpent Tail Curves Across Behind Body -->
    <!-- Body Segments (Showing gradient from tail to neck) -->
    <circle cx="90" cy="200" r="12" fill="url(#ouroBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <circle cx="112" cy="190" r="13.5" fill="url(#ouroBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <circle cx="136" cy="184" r="15" fill="url(#ouroBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <circle cx="162" cy="186" r="16.5" fill="url(#ouroBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <circle cx="188" cy="195" r="18" fill="url(#ouroBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <circle cx="214" cy="208" r="19.5" fill="url(#ouroBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <circle cx="240" cy="216" r="21" fill="url(#ouroBodyGrad)" stroke="#064e3b" stroke-width="2.5"/>

    <!-- Serpent Spine Luminous Neural Line -->
    <path d="M 90 200 C 136 170, 188 190, 240 216" fill="none" stroke="#e6fff3" stroke-width="2.5" stroke-dasharray="5 5" filter="url(#ouroGlow)"/>

    <!-- Self-Harm / Digestion Tag Floater -->
    <g transform="translate(140, 150)">
      <rect x="-42" y="-14" width="84" height="20" rx="4" fill="#132a24" stroke="#7cffb2" stroke-width="1"/>
      <text x="0" y="0" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#7cffb2" text-anchor="middle">DIGEST 20%</text>
    </g>

    <!-- Dash Wave / Crusher Cone (Invulnerable Dash in Progress) -->
    <g transform="translate(265, 220)">
      <circle cx="36" cy="0" r="44" fill="url(#dashShock)"/>
      <polygon points="0,-24 54,-36 78,0 54,36 0,24" fill="#7cffb2" fill-opacity="0.15" stroke="#7cffb2" stroke-width="1.5" stroke-dasharray="3 3"/>
    </g>

    <!-- Serpent Head (Facing Right, Horned & Glowing) -->
    <g transform="translate(265, 220)">
      <!-- Main Dragon/Serpent Skull -->
      <polygon points="-10,-22 28,-14 44,0 28,14 -10,22" fill="url(#ouroHeadGrad)" stroke="#064e3b" stroke-width="2.5" filter="url(#ouroGlow)"/>
      <!-- Crown Horns -->
      <polygon points="-2,-22 -8,-36 8,-20" fill="#7cffb2" stroke="#047857" stroke-width="1.5"/>
      <polygon points="-2,22 -8,36 8,20" fill="#7cffb2" stroke="#047857" stroke-width="1.5"/>
      <!-- Neon Slit Eyes -->
      <ellipse cx="20" cy="-8" rx="5" ry="3" fill="#ffffff" filter="url(#brightBloom)"/>
      <ellipse cx="20" cy="8" rx="5" ry="3" fill="#ffffff" filter="url(#brightBloom)"/>
      <circle cx="21" cy="-8" r="1.5" fill="#065f46"/>
      <circle cx="21" cy="8" r="1.5" fill="#065f46"/>
      <!-- Crushing Jaws & Energy Particle sparks -->
      <path d="M 44 0 L 58 0" stroke="#7cffb2" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="-6" r="2.5" fill="#7cffb2"/>
      <circle cx="50" cy="6" r="2.5" fill="#7cffb2"/>
      <!-- Dash Label -->
      <text x="32" y="-36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="800" fill="#7cffb2" text-anchor="middle" filter="url(#ouroGlow)">DASH CRUSH · INVULN</text>
    </g>

    <!-- Enemy 1: Spitter (吐酸者) on Top Right -->
    <g transform="translate(480, 110)">
      <circle cx="0" cy="0" r="18" fill="url(#spitterGrad)" stroke="#581c87" stroke-width="2"/>
      <circle cx="-5" cy="-4" r="3" fill="#ffffff"/>
      <circle cx="5" cy="-4" r="3" fill="#ffffff"/>
      <ellipse cx="0" cy="6" rx="6" ry="3" fill="#3b0764"/>
      <!-- Spitter Acid Ball -->
      <circle cx="-32" cy="18" r="8" fill="#d8b4fe" stroke="#9333ea" stroke-width="1.5" filter="url(#ouroGlow)"/>
      <text x="0" y="-24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#d8b4fe" text-anchor="middle">吐酸者 SPITTER</text>
    </g>

    <!-- Boss: 狱卒长 Warden (Boss on Depth 5, 2-Tile Size) -->
    <g transform="translate(520, 230)">
      <!-- Warden Body -->
      <rect x="-32" y="-36" width="64" height="72" rx="12" fill="url(#wardenBossGrad)" stroke="#4c0519" stroke-width="3" filter="url(#ouroGlow)"/>
      <!-- Warden Crest / Crown -->
      <polygon points="-24,-36 -32,-56 -10,-40" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
      <polygon points="24,-36 32,-56 10,-40" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
      <!-- Triple Glowing Eyes -->
      <circle cx="-16" cy="-14" r="4" fill="#fef08a"/>
      <circle cx="0" cy="-18" r="5" fill="#fde047" filter="url(#brightBloom)"/>
      <circle cx="16" cy="-14" r="4" fill="#fef08a"/>
      <!-- Boss Rune Core -->
      <polygon points="0,-4 14,14 -14,14" fill="#881337"/>
      <!-- Boss Health Bar -->
      <rect x="-44" y="-70" width="88" height="10" rx="4" fill="#181d2f" stroke="#333e61" stroke-width="1.5"/>
      <rect x="-42" y="-68" width="68" height="6" rx="3" fill="#ff2e63"/>
      <text x="0" y="-76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="800" fill="#fecdd3" text-anchor="middle">BOSS: 狱卒长 WARDEN</text>
      <!-- Spread Shot Trajectory Lines -->
      <line x1="-36" y1="0" x2="-80" y2="-20" stroke="#ff2e63" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="-36" y1="0" x2="-90" y2="0" stroke="#ff2e63" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="-36" y1="0" x2="-80" y2="20" stroke="#ff2e63" stroke-width="2" stroke-dasharray="4 4"/>
    </g>

    <!-- Collectibles: Heartstone Relic & Essence Orb -->
    <g transform="translate(620, 320)">
      <!-- Golden Essence Orb -->
      <circle cx="-30" cy="0" r="10" fill="#fbbf24" stroke="#d97706" stroke-width="2" filter="url(#ouroGlow)"/>
      <text x="-30" y="22" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">ESSENCE</text>
      <!-- Relic: Heartstone -->
      <polygon points="16,-8 24,-16 32,-8 24,8" fill="#f43f5e" stroke="#be123c" stroke-width="1.5" filter="url(#ouroGlow)"/>
      <text x="24" y="22" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#f43f5e" text-anchor="middle">RELIC</text>
    </g>

    <!-- Overlay Info -->
    <text x="670" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#475569" text-anchor="end">MAP 56×40 · 480-RAY FOV</text>
  </g>

  <!-- Left Side: Project Branding, Design Philosophy & Status -->
  <g id="brand-panel" transform="translate(48, 40)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="338" height="28" rx="14" fill="#0d241d" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="5" fill="#7cffb2" filter="url(#ouroGlow)"/>
      <text x="28" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#7cffb2" letter-spacing="1">ZERO-ASSET PROCEDURAL ROGUELIKE</text>
    </g>

    <!-- Title Group -->
    <g transform="translate(0, 64)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="2">
        衔 尾 者
      </text>
      <text x="168" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#7cffb2" filter="url(#ouroGlow)">
        OUROBOROS
      </text>
      <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
        身体是资源，不是枷锁 · 贪食蛇 × 地牢自噬下潜
      </text>
    </g>

    <!-- Core Philosophy & Pillars -->
    <g transform="translate(0, 148)">
      <!-- Pill 1: Body is Resource -->
      <g transform="translate(0, 0)">
        <rect width="186" height="34" rx="8" fill="#141c2c" stroke="#253552" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#7cffb2"/>
        <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">身体是资源 · 消化自噬</text>
      </g>
      <!-- Pill 2: 480 Ray FOV -->
      <g transform="translate(196, 0)">
        <rect width="186" height="34" rx="8" fill="#141c2c" stroke="#253552" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#38bdf8"/>
        <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">480 条光线实时 FOV</text>
      </g>
      <!-- Pill 3: Dash & Relics -->
      <g transform="translate(0, 44)">
        <rect width="186" height="34" rx="8" fill="#141c2c" stroke="#253552" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#f43f5e"/>
        <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">无敌突进 · 22 件遗物</text>
      </g>
      <!-- Pill 4: Pure Code Zero Assets -->
      <g transform="translate(196, 44)">
        <rect width="186" height="34" rx="8" fill="#141c2c" stroke="#253552" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#fbbf24"/>
        <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">纯代码运行 · 零素材库</text>
      </g>
    </g>

    <!-- Telemetry Card (Sanctuary / Game HUD) -->
    <g transform="translate(0, 248)">
      <rect width="382" height="108" rx="12" fill="url(#cardGradOuro)" stroke="#26364f" stroke-width="1.5"/>

      <!-- Header -->
      <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">SANCTUARY TELEMETRY</text>
      <circle cx="356" cy="20" r="4" fill="#7cffb2" filter="url(#ouroGlow)"/>
      <text x="344" y="23" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#7cffb2" text-anchor="end">60 FPS DETERMINISTIC</text>
      <line x1="16" y1="34" x2="366" y2="34" stroke="#1d273a" stroke-width="1"/>

      <!-- Columns -->
      <!-- DEPTH -->
      <g transform="translate(16, 52)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#94a3b8">DEPTH</text>
        <text x="0" y="18" font-family="ui-monospace, monospace" font-size="15" font-weight="800" fill="#ff4d6d">B05 BOSS</text>
        <text x="0" y="34" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">TOTAL 12</text>
      </g>

      <!-- LENGTH -->
      <g transform="translate(108, 52)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#94a3b8">LENGTH</text>
        <text x="0" y="18" font-family="ui-monospace, monospace" font-size="15" font-weight="800" fill="#7cffb2">28 SEGS</text>
        <text x="0" y="34" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">+2 DMG 消化</text>
      </g>

      <!-- DASH -->
      <g transform="translate(202, 52)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#94a3b8">DASH</text>
        <text x="0" y="18" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#38bdf8">⚡ READY</text>
        <text x="0" y="34" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">INVULN CRUSH</text>
      </g>

      <!-- ESSENCE -->
      <g transform="translate(296, 52)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#94a3b8">ESSENCE</text>
        <text x="0" y="18" font-family="ui-monospace, monospace" font-size="15" font-weight="800" fill="#ffd166">◆ 142</text>
        <text x="0" y="34" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">ECHOES META</text>
      </g>
    </g>
  </g>
</svg>
